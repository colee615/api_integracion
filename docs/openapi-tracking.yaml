openapi: 3.1.0
info:
  title: Postal Tracking and Partner Integration API
  version: 1.0.0
  description: >-
    Company scoped parcel registration, immutable tracking events, and webhook delivery. Bearer tokens only access records in their associated company. Trial tokens are additionally restricted to records created by the same token.
servers:
  - url: https://api.example.com/api/v1
    description: Replace with the environment URL issued to the integrating company.
security:
  - bearerAuth: []
tags:
  - name: Integration
  - name: Dispatches
  - name: Bags
  - name: Shipments
  - name: Tracking
  - name: Webhooks
  - name: Internal delivery
paths:
  /integration/context:
    get:
      tags: [Integration]
      summary: Read company context, permissions, statuses, and transition rules
      description: Requires packages:read. Tokens with tracking:read also receive this legacy ability.
      responses:
        '200':
          description: Integration context and supported event catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cn31/manifests:
    get:
      tags: [Dispatches]
      summary: List CN31 dispatches in the authenticated company scope
      description: Requires documents:read. Returns the latest dispatches, paginated by page. Each data item is an explicit dispatch summary without database IDs, company/token ownership fields, metadata, or audit columns. Date ranges are inclusive and use YYYY-MM-DD. dispatch_date filters the date declared by the sender; received_at filters when the API registered the CN31. Trial tokens only see dispatches created by that same token.
      parameters:
        - name: dispatch_number_manifest
          in: query
          description: Exact dispatch number match.
          schema: { type: string, pattern: '^[0-9]{10}$' }
        - name: dispatch_date_from
          in: query
          description: Inclusive lower bound for the sender-declared dispatch date.
          schema: { type: string, format: date }
        - name: dispatch_date_to
          in: query
          description: Inclusive upper bound for the sender-declared dispatch date.
          schema: { type: string, format: date }
        - name: received_at_from
          in: query
          description: Inclusive lower bound for when the API registered the CN31.
          schema: { type: string, format: date }
        - name: received_at_to
          in: query
          description: Inclusive upper bound for when the API registered the CN31.
          schema: { type: string, format: date }
        - name: per_page
          in: query
          description: Results per page; defaults to 20 and is limited to 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Paginated CN31 dispatch summaries.
          content:
            application/json:
              schema:
                type: object
                required: [current_page, data, last_page, per_page, total]
                properties:
                  current_page: { type: integer, minimum: 1 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Cn31ManifestListItem' }
                  first_page_url: { type: [string, 'null'], format: uri }
                  from: { type: [integer, 'null'] }
                  last_page: { type: integer, minimum: 1 }
                  last_page_url: { type: [string, 'null'], format: uri }
                  links:
                    type: array
                    items:
                      type: object
                      required: [active, label, url]
                      properties:
                        active: { type: boolean }
                        label: { type: string }
                        url: { type: [string, 'null'], format: uri }
                      additionalProperties: false
                  next_page_url: { type: [string, 'null'], format: uri }
                  path: { type: string, format: uri }
                  per_page: { type: integer, minimum: 1, maximum: 100 }
                  prev_page_url: { type: [string, 'null'], format: uri }
                  to: { type: [integer, 'null'] }
                  total: { type: integer, minimum: 0 }
                additionalProperties: true
        '422': { description: Invalid filter, date range, page, or page size. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cn31/manifests/{cn31Number}:
    parameters:
      - name: cn31Number
        in: path
        required: true
        description: CN31 number. This lookup does not accept dispatch_number_manifest.
        schema: { type: string, maxLength: 100 }
    get:
      tags: [Dispatches]
      summary: Read one CN31 dispatch, its bags, and delivery counts
      description: Requires documents:read. The summary counts registered CN33 rows and their delivery statuses; declared totals remain separate. Trial tokens only see records created by that same token.
      responses:
        '200':
          description: Dispatch details, each bag's delivery summary, and aggregate delivery counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      delivery_summary: { $ref: '#/components/schemas/ManifestDeliverySummary' }
                      bags:
                        type: array
                        items:
                          type: object
                          properties:
                            delivery_summary: { $ref: '#/components/schemas/PackageDeliverySummary' }
                          additionalProperties: true
                    additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: CN31 dispatch not found in the authenticated company and token scope. }

  /cn33/bags/{bagReference}:
    parameters:
      - name: bagReference
        in: path
        required: true
        description: CN31 bag number or bag dispatch number.
        schema: { type: string, maxLength: 100 }
    get:
      tags: [Bags]
      summary: Read a CN33 bag, its packages, and delivery counts
      description: Requires documents:read. Package counts use the registered CN33 rows, not the declared package count. Trial tokens only see records created by that same token.
      responses:
        '200':
          description: Bag details, package rows, physical events, and delivery summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      delivery_summary: { $ref: '#/components/schemas/PackageDeliverySummary' }
                      packages:
                        type: array
                        items:
                          type: object
                          properties:
                            tracking_code: { type: string }
                            delivery_status: { type: string, enum: [pendiente, en_proceso, completado] }
                          additionalProperties: true
                    additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: CN33 bag not found in the authenticated company and token scope. }

  /packages:
    get:
      tags: [Shipments]
      summary: List shipments in the authenticated company scope
      description: Requires tracking:read. Returns an explicit summary with tracking code, partner reference, origin from the associated CN33 row, destination, status, and timestamps; it omits database IDs, company/token ownership fields, and sender/recipient contact or document data. Trial tokens only see shipments created by that same token.
      parameters:
        - $ref: '#/components/parameters/TrackingCodeFilter'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Paginated shipment list.
          content:
            application/json:
              schema:
                type: object
                required: [current_page, data, last_page, per_page, total]
                properties:
                  current_page: { type: integer, minimum: 1 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PackageListItem' }
                  first_page_url: { type: [string, 'null'], format: uri }
                  from: { type: [integer, 'null'] }
                  last_page: { type: integer, minimum: 1 }
                  last_page_url: { type: [string, 'null'], format: uri }
                  links:
                    type: array
                    items:
                      type: object
                      required: [active, label, url]
                      properties:
                        active: { type: boolean }
                        label: { type: string }
                        url: { type: [string, 'null'], format: uri }
                      additionalProperties: false
                  next_page_url: { type: [string, 'null'], format: uri }
                  path: { type: string, format: uri }
                  per_page: { type: integer, minimum: 1 }
                  prev_page_url: { type: [string, 'null'], format: uri }
                  to: { type: [integer, 'null'] }
                  total: { type: integer, minimum: 0 }
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Shipments]
      summary: Register a shipment and its initial tracking event
      description: Requires tracking:write. Trial token shipments remain isolated to that token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_code, recipient_name]
              properties:
                tracking_code: { type: string, maxLength: 100, example: RR123456789BO }
                reference: { type: [string, 'null'], maxLength: 100 }
                recipient_name: { type: string, maxLength: 255 }
                recipient_document: { type: [string, 'null'], maxLength: 100 }
                destination: { type: [string, 'null'], maxLength: 255 }
                status: { $ref: '#/components/schemas/InitialStatus' }
                registered_at: { type: [string, 'null'], format: date-time }
                meta: { type: object, additionalProperties: true }
      responses:
        '201': { description: Shipment created with initial trace event. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /packages/{trackingCode}:
    parameters:
      - $ref: '#/components/parameters/TrackingCode'
    get:
      tags: [Shipments]
      summary: Read shipment details and the latest 20 API-visible events
      description: Requires tracking:read. The origin field is read from the associated CN33 row and is null when no row is linked. Only events marked is_public=true are included in the embedded movement list.
      responses:
        '200': { description: Shipment details and movement_history pagination hint. }
        '404': { description: Shipment not found in the authenticated scope. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /packages/{trackingCode}/movements:
    parameters:
      - $ref: '#/components/parameters/TrackingCode'
    get:
      tags: [Tracking]
      summary: Read the complete tracking history exposed by the API
      description: Requires tracking:read. Returns only movements marked is_public=true; this authenticated endpoint is not anonymous tracking.
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Chronological, paginated tracking events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TrackingEvent' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '404': { description: Shipment not found in the authenticated scope. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tracking]
      summary: Append a tracking event and update the shipment projection
      description: Requires tracking:events:write. Events are appended to the local tracking history.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 1–120 letters, digits, dots, underscores, colons, or hyphens. Scoped to company and shipment.
          schema: { type: string, minLength: 1, maxLength: 120, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [status]
                - required: [event_code]
                - required: [ips_operation_code]
              properties:
                status: { $ref: '#/components/schemas/TrackingStatus' }
                event_code:
                  type: string
                  enum: [shipment.registered, shipment.pre_alert_received, shipment.received_by_operator, shipment.accepted_at_origin, shipment.received_sorting_center, shipment.departed_origin, shipment.in_transit, shipment.arrived_destination, shipment.customs_in_progress, shipment.customs_held, shipment.customs_released, shipment.available_for_pickup, shipment.out_for_delivery, shipment.delivery_attempt, shipment.delivery_incident, shipment.return_started, shipment.returned_to_sender, shipment.delivered, shipment.lost]
                  example: shipment.customs_in_progress
                ips_operation_code:
                  type: string
                  description: Supported local operation code; its numeric event type is resolved and stored locally. Local stage rules apply; EMR requires the package's opened local CN33 bag.
                  enum: [EMR, CUSTOMS_PRESENT, CUSTOMS_INFO, EDN, EIB, EMG, CUSTOMS_RETURN, HANDOVER_AGENT, EDG, EDH, EMH, EMI]
                  example: EMR
                location: { type: [string, 'null'], maxLength: 255 }
                location_code: { type: [string, 'null'], maxLength: 80, description: Required when ips_operation_code is used. }
                reason_code: { type: [string, 'null'], maxLength: 80, pattern: '^[A-Za-z0-9._:-]+$' }
                description: { type: [string, 'null'], maxLength: 2000 }
                physical_confirmation: { type: boolean, description: Required for physical package receipt operations. }
                receptacle_reference: { type: string, maxLength: 100, description: 'For EMR, local bag number or dispatch number containing this package.' }
                condition_code: { type: integer, minimum: 1, maximum: 32767 }
                customs_office_code: { type: integer, minimum: 1, maximum: 32767 }
                customs_office_type_code: { type: string, maxLength: 3 }
                customs_release_status_code: { type: string, maxLength: 3 }
                next_office_code: { type: string, maxLength: 80 }
                domestic_receptacle_reference: { type: string, maxLength: 120 }
                delivery_agent_code: { type: string, minLength: 2, maxLength: 2 }
                non_delivery_measure: { type: string, minLength: 1, maxLength: 1 }
                delivery_mode: { type: string, enum: [DOMICILIARIA, NO_DOMICILIARIA] }
                signatory:
                  type: string
                  maxLength: 64
                  description: Optional name recorded with EMI. This text does not attach or prove signature evidence.
                occurred_at:
                  type: [string, 'null']
                  format: date-time
                  description: RFC 3339 timestamp with an explicit timezone.
                source_reference: { type: [string, 'null'], maxLength: 120 }
                meta: { type: object, additionalProperties: true }
      responses:
        '201': { description: New event appended. }
        '200': { description: Idempotent replay of an already recorded event. }
        '409': { description: Idempotency key reused with a different event payload. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cn33/bags/{bagReference}/movements:
    parameters:
      - name: bagReference
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
        description: CN31 bag number or bag dispatch number.
    get:
      tags: [Tracking]
      summary: Read the separate physical history of a CN31 bag
      description: Requires tracking:read. Returns the bag's chronological movement history and delivery rollup.
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { description: 'Chronological bag events, operational status, and delivery rollup.' }
        '404': { description: Bag not found in the authenticated scope. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tracking]
      summary: Record a local CN31 bag event
      description: Requires tracking:events:write. The operation code and numeric event type are stored in the local bag history.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 120, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ips_operation_code, location_code]
              properties:
                ips_operation_code: { type: string, enum: [RECEPTACLE_RECEIVE, RECEPTACLE_OPEN] }
                location_code: { type: string, maxLength: 80, example: BOLPBA }
                location: { type: [string, 'null'], maxLength: 255 }
                physical_confirmation: { type: boolean, description: Required for RECEPTACLE_RECEIVE. }
                description: { type: [string, 'null'], maxLength: 2000 }
                occurred_at: { type: [string, 'null'], format: date-time }
                source_reference: { type: [string, 'null'], maxLength: 120 }
                meta: { type: object, additionalProperties: true }
      responses:
        '201': { description: Local bag event appended. }
        '200': { description: Idempotent replay. }
        '409': { description: Idempotency key reused with a different event payload. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks:
    get:
      tags: [Webhooks]
      summary: List company webhook endpoints and recent deliveries
      responses:
        '200': { description: Webhook endpoint configuration and delivery summaries. }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Webhooks]
      summary: Register an HTTPS webhook endpoint
      description: Only public DNS/IP destinations are allowed. The secret is returned once and encrypted at rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, target_url, events]
              properties:
                name: { type: string, maxLength: 120 }
                target_url: { type: string, format: uri, pattern: '^https://' }
                events:
                  type: array
                  minItems: 1
                  items: { type: string, example: shipment.delivered }
                secret: { type: [string, 'null'], minLength: 16, maxLength: 120 }
                is_active: { type: boolean, default: true }
      responses:
        '201': { description: Endpoint created; includes its signing secret once. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/{webhookEndpoint}/deliveries:
    parameters:
      - name: webhookEndpoint
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Webhooks]
      summary: List delivery attempts for one endpoint
      responses:
        '200': { description: Paginated delivery history with status and retry details. }
        '404': { description: Endpoint not found in the authenticated scope. }

  /webhooks/{webhookEndpoint}/deliveries/{webhookDelivery}/retry:
    parameters:
      - name: webhookEndpoint
        in: path
        required: true
        schema: { type: integer }
      - name: webhookDelivery
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Webhooks]
      summary: Queue another attempt for a failed delivery
      responses:
        '202': { description: Delivery retry queued. }
        '404': { description: Delivery not found under the endpoint. }
        '409': { description: Delivery is not retryable. }

  /webhooks/{webhookEndpoint}/test:
    parameters:
      - name: webhookEndpoint
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Webhooks]
      summary: Queue a signed test event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_code, status]
              properties:
                tracking_code: { type: string }
                status: { $ref: '#/components/schemas/TrackingStatus' }
      responses:
        '202': { description: Test delivery queued. }
        '422': { $ref: '#/components/responses/ValidationError' }

  /webhooks/{webhookEndpoint}:
    parameters:
      - name: webhookEndpoint
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Webhooks]
      summary: Update endpoint settings or rotate its signing secret
      description: The new secret is returned once when the secret field is included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 120 }
                target_url: { type: string, format: uri, pattern: '^https://' }
                events: { type: array, minItems: 1, items: { type: string } }
                is_active: { type: boolean }
                secret: { type: string, minLength: 16, maxLength: 120 }
      responses:
        '200': { description: Endpoint updated. A rotated secret is returned once. }
        '404': { description: Endpoint not found in the authenticated scope. }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Webhooks]
      summary: Disable an endpoint while preserving delivery history
      responses:
        '200': { description: Endpoint disabled. }
        '404': { description: Endpoint not found in the authenticated scope. }

  /internal/packages/delivery-attempt:
    post:
      tags: [Internal delivery]
      security:
        - internalTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalDeliveryEvent' }
      responses:
        '201': { description: Delivery attempt recorded. }
        '200': { description: Idempotent replay of an already recorded attempt. }
        '401': { description: Invalid internal token. }
        '409': { description: Ambiguous tracking code or idempotency conflict. }

  /internal/packages/deliver:
    post:
      tags: [Internal delivery]
      security:
        - internalTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalDeliveryEvent' }
      responses:
        '200': { description: Delivery recorded or idempotently replayed. }
        '401': { description: Invalid internal token. }
        '409': { description: Ambiguous tracking code or idempotency conflict. }

webhooks:
  trackingEvent:
    post:
      summary: Event delivered to the company's configured HTTPS endpoint
      parameters:
        - name: X-Webhook-Event
          in: header
          required: true
          schema: { type: string, example: shipment.delivered }
        - name: X-Webhook-Delivery
          in: header
          required: true
          description: Stable event UUID. Use it to deduplicate at-least-once delivery.
          schema: { type: string, format: uuid }
        - name: X-Webhook-Signature
          in: header
          required: true
          description: Hex HMAC-SHA256 of the raw request body using the shared secret.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackingWebhookEvent' }
      responses:
        '200': { description: Endpoint accepted the event. }
        '204': { description: Endpoint accepted the event without a response body. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    internalTokenAuth:
      type: apiKey
      in: header
      name: X-Internal-Token
  parameters:
    TrackingCode:
      name: trackingCode
      in: path
      required: true
      schema: { type: string, maxLength: 100 }
    TrackingCodeFilter:
      name: tracking_code
      in: query
      schema: { type: string, maxLength: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 120, pattern: '^[A-Za-z0-9._:-]+$' }
  schemas:
    Cn31ManifestListItem:
      type: object
      required: [cn31_number, origin_office, destination_office, status, total_bags, total_packages, total_weight_kg, bags_count]
      properties:
        cn31_number: { type: string, maxLength: 100 }
        dispatch_number_manifest: { type: [string, 'null'], pattern: '^[0-9]{10}$' }
        origin_office: { type: string, maxLength: 150 }
        destination_office: { type: string, maxLength: 150 }
        dispatch_date: { type: [string, 'null'], format: date-time }
        received_at: { type: [string, 'null'], format: date-time }
        status: { type: string }
        status_label: { type: string }
        delivery_status: { type: string }
        delivery_status_label: { type: string }
        total_bags: { type: integer, minimum: 0 }
        total_packages: { type: integer, minimum: 0 }
        total_weight_kg: { type: number, minimum: 0 }
        bags_count: { type: integer, minimum: 0 }
      additionalProperties: false
    PackageListItem:
      type: object
      required: [tracking_code, status, status_label]
      properties:
        tracking_code: { type: string, maxLength: 100 }
        reference: { type: [string, 'null'], maxLength: 100 }
        origin: { type: [string, 'null'], maxLength: 255 }
        destination: { type: [string, 'null'], maxLength: 255 }
        status: { type: string }
        status_label: { type: string }
        registered_at: { type: [string, 'null'], format: date-time }
        last_movement_at: { type: [string, 'null'], format: date-time }
      additionalProperties: false
    PackageDeliverySummary:
      type: object
      required: [registered_packages, delivered_packages, in_process_packages, pending_packages]
      properties:
        registered_packages: { type: integer, minimum: 0, description: Number of registered CN33 package rows. }
        delivered_packages: { type: integer, minimum: 0 }
        in_process_packages: { type: integer, minimum: 0 }
        pending_packages: { type: integer, minimum: 0 }
    ManifestDeliverySummary:
      allOf:
        - $ref: '#/components/schemas/PackageDeliverySummary'
        - type: object
          required: [registered_bags, completed_bags, in_process_bags, pending_bags]
          properties:
            registered_bags: { type: integer, minimum: 0 }
            completed_bags: { type: integer, minimum: 0 }
            in_process_bags: { type: integer, minimum: 0 }
            pending_bags: { type: integer, minimum: 0 }
    InitialStatus:
      type: string
      enum: [registrado, pre_alerta_recibida, recibido_api]
    TrackingStatus:
      type: string
      enum:
        - registrado
        - pre_alerta_recibida
        - recibido_api
        - aceptado_en_origen
        - recibido_centro_clasificacion
        - clasificado
        - despachado_origen
        - en_transito
        - arribado_destino
        - en_proceso_aduana
        - retenido_aduana
        - liberado_aduana
        - disponible_retiro
        - en_ruta_entrega
        - entregado
        - intentos_carteros
        - incidencia_entrega
        - en_devolucion
        - devuelto_remitente
        - perdido
    TrackingEvent:
      type: object
      properties:
        id: { type: integer }
        event_id: { type: string, format: uuid }
        event_code: { type: string, example: shipment.in_transit }
        ips_operation_code: { type: [string, 'null'], example: EMR }
        ips_event_type_cd: { type: [integer, 'null'], example: 30 }
        physical_confirmation: { type: [boolean, 'null'] }
        status: { $ref: '#/components/schemas/TrackingStatus' }
        status_label: { type: string }
        location: { type: [string, 'null'] }
        location_code: { type: [string, 'null'] }
        reason_code: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        source: { type: string, example: company_api }
        source_reference: { type: [string, 'null'] }
        meta: { type: object, additionalProperties: true }
    BagTrackingEvent:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        event_code: { type: string, example: receptacle.received }
        ips_operation_code: { type: string, example: RECEPTACLE_RECEIVE }
        ips_event_type_cd: { type: integer, example: 130 }
        status: { type: string, enum: [recibido, abierto] }
        location_code: { type: string }
        location: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        source: { type: string, example: company_api }
        physical_confirmation: { type: [boolean, 'null'] }
        meta: { type: object, additionalProperties: true }
    TrackingWebhookEvent:
      type: object
      required: [id, type, event_code, test, occurred_at, company, shipment, data]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: shipment.in_transit }
        event_code: { type: string, example: shipment.in_transit }
        test: { type: boolean }
        occurred_at: { type: string, format: date-time }
        company:
          type: object
          properties:
            id: { type: integer }
            slug: { type: string }
            environment: { type: string }
        shipment:
          type: object
          properties:
            tracking_code: { type: string }
            tracking_standard: { type: [string, 'null'] }
            status: { $ref: '#/components/schemas/TrackingStatus' }
            status_label: { type: string }
        data:
          type: object
          properties:
            location: { type: string }
            reason_code: { type: string }
            description: { type: string }
            source_reference: { type: string }
    InternalDeliveryEvent:
      type: object
      required: [tracking_code]
      properties:
        tracking_code: { type: string, maxLength: 100 }
        company_id: { type: [integer, 'null'], description: Required when the tracking code is ambiguous. }
        occurred_at: { type: [string, 'null'], format: date-time }
        location: { type: [string, 'null'], maxLength: 255 }
        location_code: { type: [string, 'null'], maxLength: 80 }
        reason_code: { type: [string, 'null'], maxLength: 80, pattern: '^[A-Za-z0-9._:-]+$' }
        description: { type: [string, 'null'], maxLength: 2000 }
        source_reference: { type: [string, 'null'], maxLength: 120 }
        meta: { type: object, additionalProperties: true }
    PageMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked credentials.
    Forbidden:
      description: Token does not have the required ability.
    ValidationError:
      description: Input validation or tracking transition failed.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
